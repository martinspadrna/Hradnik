name: Hradník restore target safety

on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify-restore-target.mjs'
      - 'scripts/test-restore-target.mjs'
      - 'scripts/verify-restore-edge-allowlist.mjs'
      - 'scripts/test-restore-edge-allowlist.mjs'
      - 'supabase/restore-edge-allowlist.json'
      - 'supabase/restore-edge-env.json'
      - 'scripts/verify-restore-edge-env.mjs'
      - 'scripts/test-restore-edge-env.mjs'
      - 'supabase/functions/**'
      - '.github/workflows/restore-target-safety.yml'
  pull_request:
    paths:
      - 'scripts/verify-restore-target.mjs'
      - 'scripts/test-restore-target.mjs'
      - 'scripts/verify-restore-edge-allowlist.mjs'
      - 'scripts/test-restore-edge-allowlist.mjs'
      - 'supabase/restore-edge-allowlist.json'
      - 'supabase/restore-edge-env.json'
      - 'scripts/verify-restore-edge-env.mjs'
      - 'scripts/test-restore-edge-env.mjs'
      - 'supabase/functions/**'
      - '.github/workflows/restore-target-safety.yml'

permissions:
  contents: read

jobs:
  offline-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify isolated-only restore guard (no network operations)
        run: node scripts/test-restore-target.mjs
      - name: Verify explicitly approved Edge Function inventory (offline only)
        run: |
          node scripts/verify-restore-edge-allowlist.mjs
          node scripts/test-restore-edge-allowlist.mjs
      - name: Audit Edge Function environment dependencies offline
        run: |
          node scripts/verify-restore-edge-env.mjs
          node scripts/test-restore-edge-env.mjs
