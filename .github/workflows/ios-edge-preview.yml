name: Hradník iOS Edge preview icon
on:
  push:
    branches:
      - test/ios-edge-icon-20261020
    paths:
      - scripts/generate-ios-edge-install.mjs
      - tests/visual/hhradnik.spec.js
      - .github/workflows/ios-edge-preview.yml
permissions:
  contents: write
jobs:
  generate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Generate real iOS PNG and checked-in HTML
        run: node scripts/generate-ios-edge-install.mjs
      - name: Verify generated installer and app build
        run: npm run build
      - name: Commit generated iOS icon and installer to test branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/apple-touch-icon-ios-v012-test.png public/ios-install.html
          git diff --cached --quiet || git commit -m 'test(ios): check in self-contained Edge install HTML and opaque PNG'
          git push origin HEAD:test/ios-edge-icon-20261020
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run desktop and iPhone regressions
        run: npm run test:visual
